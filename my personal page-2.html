<!DOCTYPE html>
<html>
<head>
    <title>Kyle MALABANAN | Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        /* Top bar */
        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .menu {
            display: inline-block;
            margin-right: 10px;
            cursor: pointer;
        }

        /* Main container (like your drawing box) */
        .container {
            width: 80%;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        /* Input box */
        .input-box {
            margin-top: 20px;
        }

        input {
            width: 60%;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #2c3e50;
        }
    </style>
</head>

<body>

<div class="navbar">
    <span class="menu">☰</span> Home
</div>

<div class="container">
    <h1>Hi, welcome!</h1>
    <p>I am <strong>Kyle MALABANAN</strong>!</p>
    <p>What do you want to know?</p>

    <div class="input-box">
        <input type="text" placeholder="Type here...">
    </div>
</div>

</body>
</html>
